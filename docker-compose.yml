services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mie-postgres
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: mie
      POSTGRES_PASSWORD: mie
      POSTGRES_DB: mie
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-pgvector.sh:/docker-entrypoint-initdb.d/init-pgvector.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mie -d mie"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mie-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
