[project]
name = "mie-backend"
version = "0.1.0"
description = "Market Intelligence Engine - Backend API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "redis>=5.0",
    "apscheduler>=3.10",
    "crawlee>=0.4",
    "playwright>=1.45",
    "alembic>=1.13",
    "pgvector>=0.3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "openai>=3.3.1",
    "sentence-transformers>=6.0.0",
    "huggingface-hub[cli]>=1.28.0",
    "scikit-learn>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
