# ============================================================================
# Market Intelligence Engine — Production Compose
# 独立生产编排：与本地开发版 docker-compose.yml 完全隔离（独立网络/容器名/卷）
# 用法：
#   cp deploy/.env.prod.example .env.prod   # 填写密钥
#   docker compose -f docker-compose.prod.yml up -d --build
# 说明：postgres/redis/backend/frontend 均不暴露 host 端口，全部经 nginx (80/443) 对外
# ============================================================================
name: mie-prod

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mie-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mie}
      POSTGRES_DB: mie
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-pgvector.sh:/docker-entrypoint-initdb.d/init-pgvector.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mie -d mie"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      mie-net:
        ipv4_address: 172.19.0.10

  redis:
    image: redis:7-alpine
    container_name: mie-prod-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      mie-net:
        ipv4_address: 172.19.0.11

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: mie-prod-backend
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      # 静态 IP 直连（见 deploy/README.md）
      # POSTGRES_PASSWORD_URLENCODED：密码含 @ : / % 等特殊字符时必须 URL 编码
      # （如 MyPass@123 → MyPass%40123），否则 URL 解析会把 host 截断导致连接失败
      DATABASE_URL: postgresql+asyncpg://mie:${POSTGRES_PASSWORD_URLENCODED:-mie}@172.19.0.10:5432/mie
      REDIS_URL: redis://172.19.0.11:6379/0
    volumes:
      - hf_cache:/data/hf_cache
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      mie-net:
        ipv4_address: 172.19.0.12

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        # build-time 注入，指向 https://域名/api（nginx 重写去掉 /api 前缀）
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: mie-prod-frontend
    restart: unless-stopped
    environment:
      # 服务端组件直连 backend（静态 IP，不依赖 Docker DNS）
      API_URL_INTERNAL: http://172.19.0.12:8000
    depends_on:
      - backend
    networks:
      mie-net:
        ipv4_address: 172.19.0.13

  nginx:
    image: nginx:1.27-alpine
    container_name: mie-prod-nginx
    restart: unless-stopped
    ports:
      # 端口可用 env 覆盖（80 被占用时 .env.prod 设 NGINX_HTTP_PORT=8082）
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
    networks:
      mie-net:
        ipv4_address: 172.19.0.14

networks:
  mie-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16

volumes:
  postgres_data:
  redis_data:
  hf_cache:
  certbot_www:
  certbot_conf: