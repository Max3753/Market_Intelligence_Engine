# MIE 反向代理 — 无域名阶段（HTTP + 服务器 IP 直连）
# 绑定域名后升级 HTTPS：
#   cp deploy/nginx.https.conf deploy/nginx.conf
#   sed -i 's/your-domain.com/你的域名/g' deploy/nginx.conf
#   签发证书（见 deploy/README.md「升级 HTTPS」）→ docker compose ... restart nginx

server {
    listen 80;
    server_name _;

    # 后端 API：/api/xxx → backend:8000/xxx
    # 静态 IP 直连（Docker DNS 损坏时的兜底，见 deploy/README.md）
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://172.19.0.12:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端页面
    location / {
        proxy_pass http://172.19.0.13:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}