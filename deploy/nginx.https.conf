# MIE 反向代理 — HTTPS 完整版（绑定域名后使用）
# 用法：
#   cp deploy/nginx.https.conf deploy/nginx.conf
#   sed -i 's/your-domain.com/你的域名/g' deploy/nginx.conf
#   先签发证书（见 deploy/README.md「升级 HTTPS」），再重启 nginx
# 注意：证书未签发前不要用本配置，否则 nginx 因找不到证书文件启动失败

# HTTP → HTTPS 重定向 + certbot 验证
server {
    listen 80;
    server_name your-domain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name your-domain.com;

    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # 后端 API：/api/xxx → backend:8000/xxx
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端页面
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}